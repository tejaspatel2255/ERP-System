<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Octagon background -->
  <polygon points="30,5 70,5 95,30 95,70 70,95 30,95 5,70 5,30" fill="#0F2744" stroke="#5FA8FF" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Hexagon frame -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="#5FA8FF" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Centre lines -->
  <line x1="50" y1="15" x2="50" y2="85" stroke="#5FA8FF" stroke-width="1.2" stroke-dasharray="2 2" />
  <line x1="20" y1="50" x2="80" y2="50" stroke="#5FA8FF" stroke-width="1.2" stroke-dasharray="2 2" />
  
  <!-- Corner dots -->
  <circle cx="30" cy="5" r="2.5" fill="#5FA8FF" />
  <circle cx="70" cy="5" r="2.5" fill="#7DD3A8" />
  <circle cx="70" cy="95" r="2.5" fill="#F5B94A" />
  <circle cx="30" cy="95" r="2.5" fill="#5FA8FF" />
  
  <!-- Centre "N" lettermark -->
  <path d="M38 65 L38 35 L62 65 L62 35" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Centre dot -->
  <circle cx="50" cy="50" r="2.5" fill="#FFFFFF" />
</svg>
